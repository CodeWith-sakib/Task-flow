defects:
  - id: "TASKFLOW-DEF-001"
    category: "State machine violations"
    title: "Permit invalid transition from PENDING directly to SUCCESS"
    file: "src/core/state/StateTransitioner.ts"
    description: "Allowing a task to skip QUEUED and RUNNING directly into SUCCESS violates transactional safety."
    impact: "Tasks bypass queuing and worker execution while appearing finished."
    f2p_test: "tests/error/SystemErrorHandling.test.ts"
    p2p_test: "tests/unit/TaskService.test.ts"

  - id: "TASKFLOW-DEF-002"
    category: "State machine violations"
    title: "Terminal FAILED state incorrectly permits transition back to RUNNING"
    file: "src/core/state/StateTransitioner.ts"
    description: "Once a task exhausts retries and enters FAILED, it must be terminal unless explicitly resurrected via replay."
    impact: "Violates state machine invariants and causes zombie worker executions."
    f2p_test: "tests/error/SystemErrorHandling.test.ts"
    p2p_test: "tests/unit/TaskService.test.ts"

  - id: "TASKFLOW-DEF-003"
    category: "Concurrency and race conditions"
    title: "Double dequeue race condition in VisibilityQueue during concurrent dequeue calls"
    file: "src/queue/visibility/VisibilityQueue.ts"
    description: "Concurrent workers pop the same item before visibleAfter timestamp update is written."
    impact: "Multiple workers execute the same task concurrently, causing duplicate side effects."
    f2p_test: "tests/boundary/BoundaryConditions.test.ts"
    p2p_test: "tests/unit/VisibilityQueue.test.ts"

  - id: "TASKFLOW-DEF-004"
    category: "Concurrency and race conditions"
    title: "Lease fencing token fails to monotonically increment on lease renewal"
    file: "src/concurrency/lease/LeaseManager.ts"
    description: "Re-acquiring an expired lease reuses the old fence token instead of incrementing, allowing split-brain zombie writes."
    impact: "Downstream storage engines accept stale writes from timed-out workers."
    f2p_test: "tests/unit/LeaseManager.test.ts"
    p2p_test: "tests/unit/LeaseManager.test.ts"

  - id: "TASKFLOW-DEF-005"
    category: "Persistence and transaction bugs"
    title: "Corrupted WAL record replay passes validation when CRC32 checksum verification is skipped"
    file: "src/storage/wal/WALStorageEngine.ts"
    description: "Replaying WAL log skips CRC32 checksum check, deserializing truncated and corrupted bytes."
    impact: "Silent state corruption and invalid task structures restored after crash."
    f2p_test: "tests/persistence/WALStorageEngine.test.ts"
    p2p_test: "tests/unit/WALDatabaseAdapter.test.ts"

  - id: "TASKFLOW-DEF-006"
    category: "Persistence and transaction bugs"
    title: "SecondaryIndex fails to clean old status index when a task status is updated"
    file: "src/storage/index/SecondaryIndex.ts"
    description: "Updating a task status leaves the task ID in the previous status set, resulting in ghost results."
    impact: "Querying tasks by status returns tasks that are no longer in that status."
    f2p_test: "tests/unit/SecondaryIndex.test.ts"
    p2p_test: "tests/boundary/BoundaryConditions.test.ts"

  - id: "TASKFLOW-DEF-007"
    category: "Queue and stream processing errors"
    title: "DeadLetterQueue routes poisoned tasks to main queue instead of DLQ on max delivery exhaustion"
    file: "src/queue/visibility/VisibilityQueue.ts"
    description: "When deliveryCount reaches maxDeliveries, NACK re-enqueues rather than routing to DLQ."
    impact: "Poison pills cause infinite retry loops exhausting worker resources."
    f2p_test: "tests/boundary/BoundaryConditions.test.ts"
    p2p_test: "tests/unit/VisibilityQueue.test.ts"

  - id: "TASKFLOW-DEF-008"
    category: "Queue and stream processing errors"
    title: "VisibilityQueue priority sorting inverted: lower priority tasks dequeued ahead of critical tasks"
    file: "src/queue/visibility/VisibilityQueue.ts"
    description: "Sorting sorts ascending by priority instead of descending."
    impact: "Critical priority tasks starve behind low-priority batch jobs."
    f2p_test: "tests/unit/VisibilityQueue.test.ts"
    p2p_test: "tests/boundary/BoundaryConditions.test.ts"

  - id: "TASKFLOW-DEF-009"
    category: "Workflow DAG and scheduling errors"
    title: "DAGValidator fails to detect cyclic dependencies in workflow steps"
    file: "src/workflows/dag/DAGValidator.ts"
    description: "Topological sort does not report error when in-degree reduction loop fails to resolve all nodes."
    impact: "Workflow execution hangs indefinitely waiting on unresolved cyclical dependencies."
    f2p_test: "tests/unit/DAGValidator.test.ts"
    p2p_test: "tests/integration/WorkflowEngine.test.ts"

  - id: "TASKFLOW-DEF-010"
    category: "Workflow DAG and scheduling errors"
    title: "Saga compensation execution skipped when intermediate step fails"
    file: "src/workflows/WorkflowEngine.ts"
    description: "WorkflowEngine fails to invoke rollback compensations in reverse topological order upon step failure."
    impact: "Partial execution leaves external side-effects uncompensated, causing distributed state inconsistency."
    f2p_test: "tests/integration/WorkflowEngine.test.ts"
    p2p_test: "tests/unit/DAGValidator.test.ts"

  - id: "TASKFLOW-DEF-011"
    category: "Security and authorization defects"
    title: "ApiKeyManager allows unauthorized tenant access due to missing role permission check"
    file: "src/security/auth/ApiKeyManager.ts"
    description: "Role check validates read permissions for write operations (e.g. read-only key allowed to create tasks)."
    impact: "Unauthorized tenants perform destructive or state-modifying operations."
    f2p_test: "tests/unit/ApiKeyManager.test.ts"
    p2p_test: "tests/unit/TenantQuotaManager.test.ts"

  - id: "TASKFLOW-DEF-012"
    category: "Security and authorization defects"
    title: "HMAC webhook signature computation uses hardcoded salt or skips payload bytes"
    file: "src/webhooks/crypto/hmac.ts"
    description: "Signature generation signs empty string or omits secret key from HMAC-SHA256 digest."
    impact: "Forged webhook payloads are accepted by downstream receivers."
    f2p_test: "tests/unit/WebhookHMAC.test.ts"
    p2p_test: "tests/unit/WebhookDispatcher.test.ts"

  - id: "TASKFLOW-DEF-013"
    category: "Observability and tracing breaks"
    title: "TraceContext parent span ID dropped during asynchronous context propagation"
    file: "src/observability/tracing/TraceContext.ts"
    description: "Trace headers serialize traceparent without the parentSpanId field or zero-pads incorrectly."
    impact: "Distributed traces are broken; child spans appear as root spans."
    f2p_test: "tests/unit/TraceContext.test.ts"
    p2p_test: "tests/unit/MetricsRegistry.test.ts"

  - id: "TASKFLOW-DEF-014"
    category: "Observability and tracing breaks"
    title: "MetricsRegistry histogram bucketing records NaN when negative latency values occur"
    file: "src/observability/metrics/MetricsRegistry.ts"
    description: "Histogram observeHistogram does not validate duration >= 0, corrupting metric output."
    impact: "Prometheus scraper fails to parse metrics endpoint due to NaN bucket counts."
    f2p_test: "tests/unit/MetricsRegistry.test.ts"
    p2p_test: "tests/e2e/FullSystemE2E.test.ts"

  - id: "TASKFLOW-DEF-015"
    category: "Performance and backpressure regressions"
    title: "TokenBucketRateLimiter refills tokens on elapsed time calculation without floor bounds"
    file: "src/concurrency/limiter/TokenBucketRateLimiter.ts"
    description: "Token refilling allows tokens to exceed bucket capacity when burst arrives after long idle period."
    impact: "Unbounded burst traffic overwhelms worker queues and breaches upstream rate limits."
    f2p_test: "tests/unit/TokenBucketRateLimiter.test.ts"
    p2p_test: "tests/boundary/BoundaryConditions.test.ts"

  - id: "TASKFLOW-DEF-016"
    category: "Performance and backpressure regressions"
    title: "WorkerPoolAutoscaler scales down to 0 concurrency even when queue depth exceeds threshold"
    file: "src/concurrency/pool/WorkerPoolAutoscaler.ts"
    description: "Autoscaler math evaluates target concurrency to zero instead of clamping to minConcurrency."
    impact: "Worker pool completely stops processing tasks during high queue pressure."
    f2p_test: "tests/boundary/BoundaryConditions.test.ts"
    p2p_test: "tests/integration/worker.test.ts"

  - id: "TASKFLOW-DEF-017"
    category: "Lifecycle bugs"
    title: "Worker stop() resolves immediately while active tasks are still processing"
    file: "src/workers/Worker.ts"
    description: "Graceful shutdown does not wait for in-flight tasks to complete before setting isRunning = false."
    impact: "In-flight tasks are abruptly terminated or left in unacknowledged zombie state upon SIGTERM."
    f2p_test: "tests/integration/worker.test.ts"
    p2p_test: "tests/integration/lifecycle.test.ts"

  - id: "TASKFLOW-DEF-018"
    category: "Lifecycle bugs"
    title: "TaskScheduler fires cron callbacks while scheduler status is STOPPED"
    file: "src/scheduler/CronScheduler.ts"
    description: "Interval timer continues executing scheduled jobs after stop() method has been called."
    impact: "Scheduler continues executing tasks after application shutdown has initiated."
    f2p_test: "tests/unit/CronScheduler.test.ts"
    p2p_test: "tests/unit/TaskScheduler.test.ts"

  - id: "TASKFLOW-DEF-019"
    category: "Configuration mistakes"
    title: "Environment variable WORKER_CONCURRENCY parsed as string or NaN causes zero worker threads"
    file: "src/index.ts"
    description: "Application parses parseInt(process.env.WORKER_CONCURRENCY) without fallback when invalid string is passed."
    impact: "Worker pool starts with NaN concurrency, refusing to process any dequeued tasks."
    f2p_test: "tests/e2e/FullSystemE2E.test.ts"
    p2p_test: "tests/api/TaskEndpoints.test.ts"

  - id: "TASKFLOW-DEF-020"
    category: "Configuration mistakes"
    title: "Default visibility timeout defaults to negative or zero milliseconds"
    file: "src/queue/visibility/VisibilityQueue.ts"
    description: "Default visibility timeout set to 0ms instead of 30,000ms, causing immediate message redelivery."
    impact: "Dequeued messages are instantly visible again, causing infinite reprocessing thrash."
    f2p_test: "tests/boundary/BoundaryConditions.test.ts"
    p2p_test: "tests/unit/VisibilityQueue.test.ts"

  - id: "TASKFLOW-DEF-021"
    category: "Validation gaps"
    title: "TaskService accepts negative maxRetries and negative priority values"
    file: "src/core/TaskService.ts"
    description: "CreateTaskRequest payload validation fails to reject negative priority and retry limits."
    impact: "Negative retries corrupt retry counter math and lead to immediate task drops."
    f2p_test: "tests/unit/TaskService.test.ts"
    p2p_test: "tests/api/TaskEndpoints.test.ts"

  - id: "TASKFLOW-DEF-022"
    category: "Validation gaps"
    title: "CronParser accepts out-of-range month value (e.g., month 13 or 0) without throwing error"
    file: "src/scheduler/cron/CronParser.ts"
    description: "Field range check allows values outside 1-12 for month field."
    impact: "Invalid cron schedules cause getNextRun to loop forever or crash at runtime."
    f2p_test: "tests/unit/CronParser.test.ts"
    p2p_test: "tests/fuzz/CronAndDAGFuzz.test.ts"

  - id: "TASKFLOW-DEF-023"
    category: "Memory/resource leaks"
    title: "EventEmitter fails to remove listeners in off() method, causing unbounded listener accumulation"
    file: "src/events/EventEmitter.ts"
    description: "off() method looks up handler by reference using incorrect index calculation, leaving listeners active."
    impact: "Node.js MaxListenersExceededWarning and memory leak under high task churn."
    f2p_test: "tests/error/SystemErrorHandling.test.ts"
    p2p_test: "tests/integration/lifecycle.test.ts"

  - id: "TASKFLOW-DEF-024"
    category: "State machine violations"
    title: "Task retry count not incremented when moving from RUNNING back to RETRYING"
    file: "src/core/TaskService.ts"
    description: "StateTransitioner allows retry transition without bumping retryCount in task record."
    impact: "Tasks retry indefinitely, ignoring maxRetries limits."
    f2p_test: "tests/unit/RetryManager.test.ts"
    p2p_test: "tests/integration/lifecycle.test.ts"

  - id: "TASKFLOW-DEF-025"
    category: "Workflow DAG and scheduling errors"
    title: "Workflow step with failed condition filter ('when' clause) causes entire workflow to fail"
    file: "src/workflows/WorkflowEngine.ts"
    description: "A step whose 'when' conditional evaluates to false should be skipped, but instead marks step as FAILED."
    impact: "Conditional branch workflows cannot skip optional steps without failing the parent workflow."
    f2p_test: "tests/integration/WorkflowEngine.test.ts"
    p2p_test: "tests/unit/DAGValidator.test.ts"

  - id: "TASKFLOW-DEF-026"
    category: "Concurrency and race conditions"
    title: "WorkerLock release fails to notify queued waiters when lock holder errors out"
    file: "src/workers/Worker.ts"
    description: "When task execution throws an exception, lock release hook is bypassed, causing deadlock."
    impact: "Worker permanently locks up after the first encountered task failure."
    f2p_test: "tests/integration/worker.test.ts"
    p2p_test: "tests/integration/lifecycle.test.ts"

  - id: "TASKFLOW-DEF-027"
    category: "Security and authorization defects"
    title: "TenantQuotaManager allows tenant to exceed maxConcurrentTasks quota"
    file: "src/security/tenant/TenantQuotaManager.ts"
    description: "Quota check checks > instead of >= against maxConcurrentTasks."
    impact: "Tenants exceed provisioned resource limits, causing noisy-neighbor degradation."
    f2p_test: "tests/unit/TenantQuotaManager.test.ts"
    p2p_test: "tests/unit/ApiKeyManager.test.ts"

  - id: "TASKFLOW-DEF-028"
    category: "Persistence and transaction bugs"
    title: "WALStorageEngine snapshot compaction deletes active tasks not present in checkpoint"
    file: "src/storage/wal/WALStorageEngine.ts"
    description: "Compaction overwrites task index with snapshot state before flushing remaining log tail."
    impact: "Recently created tasks between checkpoint and compaction are silently lost."
    f2p_test: "tests/persistence/WALStorageEngine.test.ts"
    p2p_test: "tests/unit/WALDatabaseAdapter.test.ts"
